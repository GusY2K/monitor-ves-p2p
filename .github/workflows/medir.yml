name: Medir libro VES

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medir
        run: bash medir.sh
      - name: Guardar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/spread-ves.csv
          git diff --staged --quiet || git commit -m "medicion $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
